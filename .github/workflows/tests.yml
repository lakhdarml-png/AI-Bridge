name: Python tests

on:
  push:
    branches: ["main", "neo-local-core", "neo-local-v0.2-tool-lab", "neo-local-v0.3-approved-runner", "neo-local-v0.4-task-runner", "neo-local-v0.5-memory-task-manager", "neo-local-v0.6-planner", "neo-local-v0.6.1-safe-tool-plans"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
